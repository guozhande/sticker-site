<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="AI 制作表情 - 我的表情。输入一句话，豆包 Seedream 为你生成专属表情图片，可一键上传到站。">
<title>AI 制作表情 - 我的表情</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/ai.css">
</head>
<body class="ai-page">

<header class="ai-topbar">
  <a class="ai-back" href="../index.html" aria-label="返回主页">‹ 返回</a>
  <h1 class="ai-title">AI 制作表情</h1>
  <span class="ai-spacer"></span>
</header>

<main class="ai-main">
  <label class="ai-field">
    <span class="ai-label">描述你想画的表情（限 500 字）</span>
    <textarea id="ai-prompt" class="ai-textarea" maxlength="500" rows="3"
              placeholder="例如：一只圆滚滚的小恐龙举着爱心，卡通风格，白底"></textarea>
    <span class="ai-count"><span id="ai-count">0</span>/500</span>
  </label>

  <div class="ai-field">
    <span class="ai-label">类型</span>
    <div class="ai-sizes" role="group" aria-label="类型">
      <button type="button" class="ai-size active" data-mode="image">静图<small>Seedream 文生图</small></button>
      <button type="button" class="ai-size" data-mode="video">动图<small>可灵视频转 GIF</small></button>
    </div>
  </div>

  <div class="ai-field" id="ai-size-field">
    <span class="ai-label">图片尺寸</span>
    <div class="ai-sizes" role="group" aria-label="图片尺寸">
      <button type="button" class="ai-size active" data-size="1K">1K 竖图<small>864 × 1152</small></button>
      <button type="button" class="ai-size" data-size="2K">2K 高清<small>更大尺寸</small></button>
    </div>
  </div>

  <!-- 参考图（图生图，仅静图模式显示；切动图时仅隐藏、不清状态） -->
  <div class="ai-field" id="ai-ref-field">
    <span class="ai-label">参考图（可选，图生图）</span>
    <button type="button" class="ai-ref-add" id="ai-ref-add">＋ 添加参考图（可选）</button>
    <div class="ai-ref-processing" id="ai-ref-processing" hidden>
      <span class="ai-spinner"></span>
      <span class="ai-ref-processing-text" id="ai-ref-processing-text"></span>
      <span>处理中…</span>
    </div>
    <div class="ai-ref-preview" id="ai-ref-preview" hidden>
      <img class="ai-ref-thumb" id="ai-ref-thumb" alt="参考图预览">
      <span class="ai-ref-name" id="ai-ref-name"></span>
      <button type="button" class="ai-ref-remove" id="ai-ref-remove" aria-label="删除参考图">&times;</button>
    </div>
    <input type="file" id="ai-ref-file" accept="image/jpeg,image/png,image/webp" hidden>
    <div class="ai-ref-modes" id="ai-ref-modes" hidden>
      <span class="ai-label">相似度</span>
      <div class="ai-sizes" role="group" aria-label="相似度">
        <button type="button" class="ai-size active" data-ref-mode="free">自由发挥<small>模型参考图片自行发挥</small></button>
        <button type="button" class="ai-size" data-ref-mode="style">参考风格<small>沿用风格、配色与质感</small></button>
        <button type="button" class="ai-size" data-ref-mode="keep">保持主体<small>尽量保留主体外观</small></button>
      </div>
      <p class="ai-ref-hint">相似度由提示词控制，无法精确调节</p>
    </div>
  </div>

  <div class="ai-field" id="ai-duration-field" hidden>
    <span class="ai-label">视频时长</span>
    <div class="ai-sizes" role="group" aria-label="视频时长">
      <button type="button" class="ai-size" data-duration="3">3 秒</button>
      <button type="button" class="ai-size" data-duration="4">4 秒</button>
      <button type="button" class="ai-size active" data-duration="5">5 秒<small>推荐</small></button>
    </div>
  </div>

  <!-- 动图首帧（图生图）：上传静图直接作首帧，或上传动图取帧（总帧数 + 第 1/2 帧 + 手动帧号）。
       仅动图模式显示；GIF 只在前端解析取帧，本体不上传 -->
  <div class="ai-field" id="ai-vidref-field" hidden>
    <span class="ai-label">动图首帧（可选，图生图）</span>
    <div class="ai-vidref-entry">
      <button type="button" class="ai-ref-add" id="ai-vidref-add">＋ 上传静图作首帧</button>
      <button type="button" class="ai-ref-add" id="ai-gif-add">＋ 上传动图取帧</button>
    </div>
    <div class="ai-ref-processing" id="ai-vidref-processing" hidden>
      <span class="ai-spinner"></span>
      <span class="ai-ref-processing-text" id="ai-vidref-processing-text"></span>
      <span>处理中…</span>
    </div>
    <div class="ai-ref-preview" id="ai-vidref-preview" hidden>
      <img class="ai-ref-thumb" id="ai-vidref-thumb" alt="动图首帧预览">
      <span class="ai-ref-name" id="ai-vidref-name"></span>
      <button type="button" class="ai-ref-remove" id="ai-vidref-remove" aria-label="删除首帧">&times;</button>
    </div>
    <input type="file" id="ai-vidref-file" accept="image/jpeg,image/png,image/webp" hidden>
    <input type="file" id="ai-gif-file" accept="image/gif" hidden>
    <div class="ai-gif-panel" id="ai-gif-panel" hidden>
      <p class="ai-gif-count">动图共 <span id="ai-gif-total"></span> 帧，请选择取哪一帧作首帧：</p>
      <div class="ai-gif-actions">
        <button type="button" class="ai-size" id="ai-gif-pick1">取第 1 帧</button>
        <button type="button" class="ai-size" id="ai-gif-pick2">取第 2 帧</button>
      </div>
      <div class="ai-gif-manual">
        <label class="ai-gif-manual-label" for="ai-gif-frame">手动填写截取第几帧</label>
        <input type="number" class="ai-gif-input" id="ai-gif-frame" min="1" inputmode="numeric" placeholder="帧号">
        <button type="button" class="ai-gif-ok" id="ai-gif-ok">确定</button>
      </div>
      <p class="ai-gif-err" id="ai-gif-err" hidden></p>
    </div>
  </div>

  <button type="button" class="ai-generate" id="ai-generate" disabled>生成</button>

  <section class="ai-result" id="ai-result" aria-live="polite">
    <div class="ai-empty" id="ai-empty">生成后的图片会显示在这里</div>
    <div class="ai-loading" id="ai-loading" hidden>
      <span class="ai-spinner"></span><span id="ai-loading-text">正在生成，约需 10–30 秒…</span>
    </div>
    <div class="ai-error" id="ai-error" hidden></div>
    <figure class="ai-figure" id="ai-figure" hidden>
      <img id="ai-img" alt="AI 生成的表情图片">
      <figcaption class="ai-figure-actions">
        <button type="button" class="ai-upload-btn" id="ai-upload-btn">上传到站</button>
        <button type="button" class="ai-regen-btn" id="ai-regen-btn">重新生成</button>
      </figcaption>
    </figure>
  </section>
</main>

<!-- 上传表单（作品名必填、角色名选填） -->
<div class="up-overlay" id="ai-upload-modal" role="dialog" aria-modal="true">
  <div class="up-dialog">
    <button class="up-close" id="ai-upload-close" type="button" aria-label="关闭">&times;</button>
    <h3 class="up-title">上传作品</h3>
    <label class="up-field">
      <span class="up-label">作品名称（必填）</span>
      <input class="up-text" id="ai-work" type="text" maxlength="60" placeholder="例如：AI 小恐龙">
    </label>
    <label class="up-field">
      <span class="up-label">角色名（选填，多个用逗号分隔）</span>
      <input class="up-text" id="ai-chars" type="text" placeholder="例如：原神，胡桃">
    </label>
    <div class="up-actions">
      <button class="up-btn up-cancel" id="ai-upload-cancel" type="button">取消</button>
      <button class="up-btn up-primary" id="ai-upload-submit" type="button" disabled>提交</button>
    </div>
  </div>
</div>

<!-- 上传成功 -->
<div class="up-overlay" id="ai-success-modal" role="dialog" aria-modal="true">
  <div class="up-dialog">
    <h3 class="up-title">上传成功 🎉</h3>
    <p class="up-hint">作品「<span id="ai-success-work"></span>」已上传，回主页即可看到。</p>
    <div class="up-actions ai-success-actions">
      <a class="up-btn up-primary" href="../index.html">再去看看</a>
      <button class="up-btn up-cancel" id="ai-success-close" type="button">继续制作</button>
    </div>
  </div>
</div>

<div class="up-toast" id="up-toast"></div>

<script src="../js/config.js"></script>
<script src="../vendor/gifuct-js.vendor.js"></script>
<script src="../js/gif-frame.js"></script>
<script src="../js/ai.js"></script>
</body>
</html>
